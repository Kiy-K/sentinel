# CI for the Sentinel app. Builds the app and runs the deterministic e2e suite
# (tests/example.e2e.ts + tests/smoke.e2e.ts) against a real server.
# tests/live-dashboard.e2e.ts is intentionally NOT run here: it needs a ChatGPT
# OAuth login (e2e login openai) that CI cannot hold. Run it locally with
# `bun run test:e2e:live`.
name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  E2E_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  APP_URL: http://localhost:3000

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install browsers
        run: bunx e2e-web install chromium --with-deps

      - name: Build
        run: bun run build

      - name: Start app
        run: |
          export SENTINEL_DATA_DIR="$RUNNER_TEMP/sentinel-data"
          mkdir -p "$SENTINEL_DATA_DIR"
          nohup bun .mastra/output/index.mjs > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$APP_URL/healthz" >/dev/null 2>&1; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app failed to start; log:" >&2
          cat "$RUNNER_TEMP/app.log" >&2
          exit 1

      - name: Run e2e
        run: bunx e2e run tests/smoke.e2e.ts tests/example.e2e.ts --reporter list,junit

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/results
          # .e2e is a hidden directory, which upload-artifact skips when it expands a folder.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
